name: after-close research

on:
  schedule:
    # 17:30 ET in summer / 16:30 ET in winter: after the quote archive settles.
    - cron: "30 21 * * 1-5"
    # Redundant, idempotent catch-up pass. It is research-only and carries no
    # broker credentials, so scheduler delay cannot silently cost a session.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      session:
        description: "ET session date (YYYY-MM-DD); blank uses today's ET date"
        required: false
        type: string
      dry_run:
        description: "Build ledgers without publishing research rows"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: after-close-research
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SEVE_DARK_EXACT_MAX_COST_USD: ${{ vars.SEVE_DARK_EXACT_MAX_COST_USD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve ET session date
        shell: bash
        env:
          SESSION_INPUT: ${{ inputs.session }}
        run: |
          session="$SESSION_INPUT"
          if [[ -z "$session" ]]; then session="$(TZ=America/New_York date +%F)"; fi
          if [[ ! "$session" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid ET session date: $session" >&2
            exit 1
          fi
          echo "SESSION_DATE_ET=$session" >> "$GITHUB_ENV"
          prior="$(date -d "$session -1 day" +%F)"
          while [[ "$(date -d "$prior" +%u)" -gt 5 ]]; do prior="$(date -d "$prior -1 day" +%F)"; done
          echo "PRIOR_SESSION_DATE_ET=$prior" >> "$GITHUB_ENV"
      - name: Verify research policy
        id: research-policy
        run: |
          npm run after-close-research-selftest
          npm run gate-shadow-policy-selftest
          npm run gate-shadow-verification-selftest
          npm run reconcile-shadow-rebuild-selftest
          npm run vb-candidate-evidence-selftest
          npm run dark-candidate-freeze-selftest
          npm run dark-candidate-t1-safety-selftest
          npm run nightly-dark-exact-learning-selftest
          npm run weekend-exact-research-selftest
          npm run publish-dark-exact-receipts-selftest
          npm run sentinel-manager-book-selftest
          npm run sentinel-release-audit-selftest
          npm run channel-decision-packet-selftest
          npm run channel-trail-frontier-selftest
          npm run research-council-selftest
          npm run entry-qualification-policy-selftest
          npm run manager-pattern-scan-selftest
      - name: Build and publish session research
        id: shadow-rebuild
        continue-on-error: true
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--session "$SESSION_DATE_ET" --virtual-trades-only --stamp-provenance)
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_INPUT" == "true" ]]; then
            args+=(--read-only)
          fi
          npm run gate-shadow:hosted -- "${args[@]}"
          if [[ "$EVENT_NAME" != "workflow_dispatch" || "$DRY_RUN_INPUT" != "true" ]]; then
            npm run verify-shadow-rebuild:hosted -- \
              --session "$SESSION_DATE_ET" \
              --output-dir data
          fi
      - name: Capture current and score prior exact candidates
        id: exact-learning
        continue-on-error: true
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          npm run dark-candidate-freeze:hosted -- \
            --date "$SESSION_DATE_ET" \
            --out "data/dark-candidate-freezes/$SESSION_DATE_ET"
          if [[ -n "$DATABENTO_API_KEY" && -n "$R2_ACCOUNT_ID" && -n "$R2_ACCESS_KEY_ID" \
                && -n "$R2_SECRET_ACCESS_KEY" && -n "$R2_BUCKET" \
                && "$SEVE_DARK_EXACT_MAX_COST_USD" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            exact_args=(
              --session "$PRIOR_SESSION_DATE_ET"
              --output-dir "data/decision-atlas/runs/$PRIOR_SESSION_DATE_ET/exact-learning"
              --max-provider-cost-usd "$SEVE_DARK_EXACT_MAX_COST_USD"
            )
            if [[ "$EVENT_NAME" != "workflow_dispatch" || "$DRY_RUN_INPUT" != "true" ]]; then
              exact_args+=(--publish)
            fi
            npm run nightly-dark-exact-learning -- "${exact_args[@]}"
          else
            echo "Exact T+1 learning skipped: provider/storage credentials or cost ceiling are unavailable."
          fi
      - name: Build nightly Decision Atlas
        shell: bash
        run: |
          npm run nightly-decision-atlas -- \
            --through "$SESSION_DATE_ET" \
            --out-dir "data/decision-atlas/runs/$SESSION_DATE_ET" \
            --shadow-catchup-manifest data/gate-shadow-catchup-manifest.json
      - name: Scan manager and entry patterns by logical trade
        shell: bash
        run: |
          npm run manager-pattern-scan -- \
            --ledger-file "data/decision-atlas/runs/$SESSION_DATE_ET/profitability/ledger.json" \
            --snapshot-file "data/decision-atlas/runs/$SESSION_DATE_ET/atlas/snapshot.json" \
            --from 2026-07-14 \
            --through "$SESSION_DATE_ET" \
            --out-dir "data/decision-atlas/runs/$SESSION_DATE_ET/manager-patterns"
      - name: Publish concise Atlas briefs for the dashboard
        if: vars.DECISION_ATLAS_DASHBOARD_PUBLISH == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        shell: bash
        run: |
          npm run publish-channel-decision-briefs -- \
            --publish \
            --expected-through "$SESSION_DATE_ET" \
            --briefs-file "data/decision-atlas/runs/$SESSION_DATE_ET/learning/dashboard-briefs.json" \
            --receipt-file "data/decision-atlas/runs/$SESSION_DATE_ET/briefs/publication-receipt.json"
      - name: Verify Priority A experiment baselines
        id: priority-a-readiness
        continue-on-error: true
        shell: bash
        run: |
          npm run priority-a-retune-readiness -- \
            --out-dir "data/decision-atlas/runs/$SESSION_DATE_ET/priority-a-readiness"
      - name: Build deterministic Sentinel operator packet
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(
            --session "$SESSION_DATE_ET"
            --freeze "data/dark-candidate-freezes/$SESSION_DATE_ET/freeze.json"
            --out "data/sentinel-packets/$SESSION_DATE_ET.json"
          )
          if [[ "$EVENT_NAME" != "workflow_dispatch" || "$DRY_RUN_INPUT" != "true" ]]; then
            args+=(--publish)
          fi
          npm run deterministic-sentinel:hosted -- "${args[@]}"
      - name: Freeze artifact checksums
        shell: bash
        run: |
          {
            sha256sum \
              data/gate-shadow.json \
              data/gate-shadow-receipt.json \
              data/gate-shadow-catchup-manifest.json \
              data/vb-candidates.json \
              data/vb-candidate-censors.json \
              "data/dark-candidate-freezes/$SESSION_DATE_ET/freeze.json" \
              "data/dark-candidate-freezes/$SESSION_DATE_ET/contract-manifest.json" \
              "data/dark-candidate-freezes/$SESSION_DATE_ET/report.md" \
              "data/dark-candidate-freezes/$SESSION_DATE_ET/receipt.json" \
              "data/sentinel-packets/$SESSION_DATE_ET.json" \
              "data/sentinel-packets/$SESSION_DATE_ET.receipt.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/profitability/receipt.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/atlas/receipt.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/manager-patterns/scan.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/manager-patterns/scan.md" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/trails/receipt.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/trails/frontier.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/weekly/receipt.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/briefs/receipt.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/council/receipt.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/council/council.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/learning/receipt.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/learning/packet.json" \
              "data/decision-atlas/runs/$SESSION_DATE_ET/priority-a-readiness/readiness.json"
            if [[ -f data/gate-shadow-verification.json ]]; then
              sha256sum data/gate-shadow-verification.json
            fi
            if [[ -f "data/decision-atlas/runs/$PRIOR_SESSION_DATE_ET/exact-learning/receipt.json" ]]; then
              sha256sum \
                "data/decision-atlas/runs/$PRIOR_SESSION_DATE_ET/exact-learning/receipt.json" \
                "data/decision-atlas/runs/$PRIOR_SESSION_DATE_ET/exact-learning/publication-receipt.json"
            fi
          } | tee after-close-sha256.txt
          {
            echo "## After-close research receipt"
            echo '```text'
            cat after-close-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frozen research ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-close-research-${{ github.run_id }}
          path: |
            data/gate-shadow.json
            data/gate-shadow-receipt.json
            data/gate-shadow-catchup-manifest.json
            data/gate-shadow-verification.json
            data/vb-candidates.json
            data/vb-candidate-censors.json
            data/dark-candidate-freezes/**
            data/sentinel-packets/**
            data/decision-atlas/runs/**
            after-close-sha256.txt
          # A fail-closed verifier is most useful when its partial ledger and
          # mismatch report survive for exact, manifest-bound recovery.
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce legacy shadow integrity after capture
        if: always() && steps.shadow-rebuild.outcome != 'success'
        shell: bash
        run: |
          echo "Legacy shadow rebuild or verifier failed; exact capture was allowed to continue and diagnostics were preserved." >&2
          exit 1
      - name: Enforce exact-learning integrity after Atlas publication
        if: always() && steps.exact-learning.outcome != 'success'
        shell: bash
        run: |
          echo "Exact T+1 learning failed; core Atlas, briefs, council, Sentinel, and diagnostics were still allowed to publish." >&2
          exit 1
